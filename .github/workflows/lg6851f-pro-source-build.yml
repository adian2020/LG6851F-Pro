name: LG6851F-Pro 独立源码实验构建

on:
  push:
    branches: [cloud-build-lg6851f-pro]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lg6851f-pro-source-experimental
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    outputs:
      build_id: ${{ steps.identity.outputs.build_id }}
    steps:
      - name: 检出独立实验分支
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 核对分支并记录构建身份
        id: identity
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = cloud-build-lg6851f-pro
          echo "BUILD_ID=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "build_id=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD
      - name: 准备磁盘与编译依赖
        run: |
          sudo python3 - <<'PY'
          import shutil
          from pathlib import Path
          for name in ['/usr/local/lib/android','/usr/share/dotnet','/opt/ghc','/opt/hostedtoolcache/CodeQL']:
              path=Path(name)
              if path.is_dir():shutil.rmtree(path)
          PY
          df -h
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-distutils python3-setuptools python3-venv rsync unzip zlib1g-dev file wget curl swig jq xsltproc libelf-dev zstd squashfs-tools device-tree-compiler
          python3 -m venv .cloud-venv
          .cloud-venv/bin/pip install pycryptodome pyasn1 cryptography
          echo "$GITHUB_WORKSPACE/.cloud-venv/bin" >> "$GITHUB_PATH"
      - name: 恢复上游源码下载缓存
        id: restore-downloads
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: lg6851f-pro-dl-v2-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lg6851f-pro-dl-v2-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}-
      - name: 检查源码材料和移植工具
        run: |
          python3 scripts/cloud/prepare_source.py --check
          python3 -m unittest discover -s scripts/cloud/tests -p 'test_*.py'
          bash -n scripts/cloud/build.sh
      - name: 编译内核及厂商源码并分别构建两槽固件
        id: compile
        env:
          JOBS: '4'
        run: |
          set -o pipefail
          mkdir -p build-logs
          ./scripts/cloud/build.sh 2>&1 | tee build-logs/cloud-build.log
      - name: 上传经检查的实验固件
        uses: actions/upload-artifact@v4
        with:
          name: LG6851F-Pro-source-experimental-${{ steps.identity.outputs.build_id }}
          path: cloud-dist/
          if-no-files-found: error
          retention-days: 14
      - name: 上传与本固件匹配的已签名软件源
        uses: actions/upload-artifact@v4
        with:
          name: LG6851F-Pro-compiled-feed
          path: build-cloud/compiled-feed/
          if-no-files-found: error
          retention-days: 14
      - name: 保留构建和失败诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LG6851F-Pro-source-diagnostics
          path: |
            build-logs/
            build-cloud/*.json
            logs/
            .config
          include-hidden-files: true
          retention-days: 14
      - name: 保存本次上游源码下载
        if: ${{ !cancelled() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: dl
          key: ${{ steps.restore-downloads.outputs.cache-primary-key }}

  publish-apk:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 读取已验签的软件包产物
        uses: actions/download-artifact@v4
        with:
          name: LG6851F-Pro-compiled-feed
          path: feed-input
      - name: 发布独立实验固件专用源
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ needs.build.outputs.build_id }}
        run: |
          set -euo pipefail
          test "$(cat feed-input/build-id.txt)" = "$BUILD_ID"
          for feed in target base luci packages; do test -s "feed-input/$feed/packages.adb"; done
          git init feed-publish
          git -C feed-publish remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/cloud-build-lg6851f-pro-apk" > /dev/null 2>&1; then
            git -C feed-publish -c credential.helper='!gh auth git-credential' fetch --depth 1 origin cloud-build-lg6851f-pro-apk
            git -C feed-publish checkout -b cloud-apk FETCH_HEAD
          else
            git -C feed-publish checkout --orphan cloud-apk
          fi
          test ! -e "feed-publish/$BUILD_ID"
          mkdir "feed-publish/$BUILD_ID"
          cp -a feed-input/. "feed-publish/$BUILD_ID/"
          git -C feed-publish config user.name github-actions[bot]
          git -C feed-publish config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C feed-publish add "$BUILD_ID"
          git -C feed-publish commit -m "发布独立实验固件匹配软件源 $BUILD_ID"
          git -C feed-publish -c credential.helper='!gh auth git-credential' push origin HEAD:refs/heads/cloud-build-lg6851f-pro-apk
